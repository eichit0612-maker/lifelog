name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 実行中のデプロイは中断せず、待ちは最新の1件だけ残す。
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          # package-lock.json は npm 11 で生成されている。Node 22 だと同梱の npm 10 が
          # 「@emnapi/* が lock に無い」と EUSAGE で落ちるため、npm 11 が入る Node 24 に揃える。
          node-version: 24
          cache: npm

      - name: Resolve basePath
        # <user>.github.io リポジトリと独自ドメインはルート配信、それ以外は /<repo>/ 配下。
        run: |
          repo="${{ github.event.repository.name }}"
          if [[ "$repo" == *.github.io ]] || [ -f public/CNAME ]; then
            echo "NEXT_PUBLIC_BASE_PATH=" >> "$GITHUB_ENV"
          else
            echo "NEXT_PUBLIC_BASE_PATH=/$repo" >> "$GITHUB_ENV"
          fi

      - run: npm ci

      - name: Build (db/lifelog.db を読んで out/ に静的化)
        run: npm run build:pages

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
